# AD5X bed load cell board on ttyS7: Kalico's load cell command names, sent to the board as H commands
# (no [load_cell] section in this config, so these names are free for macros)

[gcode_shell_command loadcell]
command: sh /usr/data/openad5x/loadcell/loadcell.sh
timeout: 60
verbose: True

[gcode_macro LOAD_CELL_TARE]
description: Zero the bed load cell (H1, checked with H7)
gcode:
  RUN_SHELL_COMMAND CMD=loadcell PARAMS=tare

[gcode_macro LOAD_CELL_READ]
description: Show the bed load cell reading (H7)
gcode:
  RUN_SHELL_COMMAND CMD=loadcell PARAMS=read

[gcode_macro LOAD_CELL_DIAGNOSTIC]
description: Read the bed load cell several times (H7)
gcode:
  RUN_SHELL_COMMAND CMD=loadcell PARAMS="diag {params.COUNT|default(10)|int}"

# stock before every probe session: G1 Z5 F800, M400, tare (nozzle off the bed)
[gcode_macro _LOAD_CELL_PREPARE]
gcode:
  SAVE_GCODE_STATE NAME=load_cell_prepare
  G90
  G1 Z5 F800
  RESTORE_GCODE_STATE NAME=load_cell_prepare
  M400
  LOAD_CELL_TARE

[gcode_macro PROBE]
rename_existing: _PROBE_BASE
gcode:
  _LOAD_CELL_PREPARE
  _PROBE_BASE {rawparams}

[gcode_macro PROBE_ACCURACY]
rename_existing: _PROBE_ACCURACY_BASE
gcode:
  _LOAD_CELL_PREPARE
  _PROBE_ACCURACY_BASE {rawparams}

[gcode_macro PROBE_CALIBRATE]
rename_existing: _PROBE_CALIBRATE_BASE
gcode:
  _LOAD_CELL_PREPARE
  _PROBE_CALIBRATE_BASE {rawparams}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
gcode:
  _LOAD_CELL_PREPARE
  _BED_MESH_CALIBRATE_BASE {rawparams}

# Z homing: switch first (position_endstop 220), then probe the bed centre and make the touch Z=0
# (needs the load cell macros below: PROBE tares first)

[gcode_macro G28]
rename_existing: G28.1
gcode:
  G28.1 {rawparams}
  {% if not rawparams or 'Z' in rawparams|upper %}
    _HOME_Z_PROBE
  {% endif %}

[gcode_macro _HOME_Z_PROBE]
gcode:
  {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
    SAVE_GCODE_STATE NAME=home_z_probe
    G90
    G1 Z10 F1500
    G1 X107.5 Y107.5 F12000
    PROBE HOME=Z
    G1 Z5 F800
    RESTORE_GCODE_STATE NAME=home_z_probe
  {% else %}
    {action_respond_info("Z homed to the switch only (home X and Y for the bed probe)")}
  {% endif %}

# Setup and calibration: input shaper, nozzle PID, bed PID, then SAVE_CONFIG (restarts Klipper)
# ADX_QUICK_START [EXTRUDER_TEMP=220] [BED_TEMP=60]
[gcode_macro ADX_QUICK_START]
gcode:
  {% set etemp = params.EXTRUDER_TEMP|default(220)|float %}
  {% set btemp = params.BED_TEMP|default(60)|float %}
  G28
  SHAPER_CALIBRATE
  PID_CALIBRATE HEATER=extruder TARGET={etemp}
  PID_CALIBRATE HEATER=heater_bed TARGET={btemp}
  TURN_OFF_HEATERS
  SAVE_CONFIG

# START_PRINT / END_PRINT for the AD5X on Kalico (stock firmwareExe handled this on stock)
# Slicer start gcode: START_PRINT EXTRUDER_TEMP=.. BED_TEMP=.. then a prime line G0 Y219.6, G1 X130 E5
# Ends at X20 Y219.6 Z0.3 with E0 so the slicer prime line draws X20->X130 along the back edge

# Fluidd / Mainsail switch: on = mesh only where the print is, off = full bed
[output_pin Adaptive_Mesh]
pin: virtual_pin:adaptive_mesh_pin
value: 1

[gcode_macro START_PRINT]
gcode:
  {% set etemp = params.EXTRUDER_TEMP|default(220)|float %}
  {% set btemp = params.BED_TEMP|default(60)|float %}
  {% set adaptive = 1 if printer['output_pin Adaptive_Mesh'].value else 0 %}
  M140 S{btemp}
  M104 S150
  G28
  M190 S{btemp}
  BED_MESH_CALIBRATE ADAPTIVE={adaptive}
  G90
  G1 Z5 F600
  G1 X20 Y219.6 F12000
  M109 S{etemp}
  G1 Z0.3 F600
  G92 E0

[gcode_macro END_PRINT]
gcode:
  M400
  {% if printer['AFC_IFS IFS_1'] is defined %}
    ADX_END_UNLOAD
  {% endif %}
  G92 E0
  G1 E-2 F600
  TURN_OFF_HEATERS
  {% set z = printer.toolhead.position.z %}
  {% set zmax = printer.toolhead.axis_maximum.z %}
  G90
  G1 Z{[z + 5, zmax]|min} F600
  G1 X52.5 Y220 F12000
  BED_MESH_CLEAR
  SET_IDLE_TIMEOUT TIMEOUT=1800
  M107
  M84

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
  M400
  {% if printer['AFC_IFS IFS_1'] is defined %}
    ADX_END_UNLOAD
  {% endif %}
  G92 E0
  G1 E-2 F600
  TURN_OFF_HEATERS
  {% if 'xyz' in printer.toolhead.homed_axes %}
  {% set z = printer.toolhead.position.z %}
  {% set zmax = printer.toolhead.axis_maximum.z %}
  G90
  G1 Z{[z + 5, zmax]|min} F600
  G1 X52.5 Y220 F12000
  {% endif %}
  BED_MESH_CLEAR
  SET_IDLE_TIMEOUT TIMEOUT=1800
  M107
  M84
  BASE_CANCEL_PRINT

[respond]

[gcode_macro PAUSE]
description: Pause like stock: heater off, park in the chute, extruder motor off
rename_existing: PAUSE_BASE
variable_extruder_temp: 0
variable_bed_temp: 0
variable_fan_speed: 0
gcode:
  {% if not printer.pause_resume.is_paused %}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=extruder_temp VALUE={printer.extruder.target}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=bed_temp VALUE={printer.heater_bed.target}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=fan_speed VALUE={printer['fan_generic fanM106'].speed}
    PAUSE_BASE
    SET_IDLE_TIMEOUT TIMEOUT=864000
    M104 S0
    M106 S255
    {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
      ADX_PARK
    {% endif %}
    M400
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    M106 S0
  {% endif %}

[gcode_macro RESUME]
description: Resume like stock: reheat, purge and brush in the chute, then back to the print
rename_existing: RESUME_BASE
gcode:
  {% set pause = printer['gcode_macro PAUSE'] %}
  {% set etemp = pause.extruder_temp|float %}
  {% set btemp = pause.bed_temp|float %}
  {% if printer.pause_resume.is_paused %}
    M140 S{btemp}
    M104 S{etemp}
    G4 P3000
    {% if etemp >= 30 %}
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={etemp - 2} MAXIMUM={etemp + 5}
    {% endif %}
    {% if btemp >= 10 %}
      TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={btemp - 2} MAXIMUM={btemp + 5}
    {% endif %}
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1
    SET_IDLE_TIMEOUT TIMEOUT=864000
    {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
      ADX_PARK
      {% if etemp >= 30 %}
        ADX_RESUME_FLUSH
      {% endif %}
    {% endif %}
    SET_FAN_SPEED FAN=fanM106 SPEED={pause.fan_speed}
    G90
    {% if 'x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes %}
      ADX_BRUSH
    {% endif %}
    RESUME_BASE VELOCITY=100
  {% endif %}

# GrumpyScreen's extrude, retract and load buttons (grumpyscreen.cfg [default_macros]); SPEED is mm/min
[gcode_macro _GUPPYSCREEN_EXTRUDE]
gcode:
  _SCREEN_EXTRUDE TEMP={params.EXTRUDER_TEMP|default(0)} LEN={params.EXTRUDE_LEN|default(10)|float} F={params.SPEED|default(300)}

[gcode_macro _GUPPYSCREEN_RETRACT]
gcode:
  {% set length = params.EXTRUDE_LEN|default(10)|float %}
  _SCREEN_EXTRUDE TEMP={params.EXTRUDER_TEMP|default(0)} LEN={0 - length} F={params.SPEED|default(300)}

# stock non-IFS load: G1 E90 F300
[gcode_macro LOAD_FILAMENT]
gcode:
  _SCREEN_EXTRUDE TEMP={params.EXTRUDER_TEMP|default(0)} LEN=90 F=300

[gcode_macro _SCREEN_EXTRUDE]
gcode:
  {% if printer.print_stats.state == "printing" %}
    {action_raise_error("Not available while printing")}
  {% endif %}
  {% set old_target = printer.extruder.target %}
  {% set temp = params.TEMP|float if params.TEMP|float > 0 else old_target %}
  {% if temp <= 0 %}
    {action_raise_error("No nozzle temperature set")}
  {% endif %}
  M109 S{temp}
  SAVE_GCODE_STATE NAME=_screen_extrude
  M83
  G1 E{params.LEN|float} F{params.F|float}
  RESTORE_GCODE_STATE NAME=_screen_extrude
  M400
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
  {% if old_target != temp %}
    M104 S{old_target}
  {% endif %}

# GrumpyScreen's jog buttons: _CLIENT_LINEAR_MOVE X=.. / Y=.. F=7800, Z=.. F=600, moves relative to now
[gcode_macro _CLIENT_LINEAR_MOVE]
gcode:
  {% set move = [] %}
  {% for axis in ["X", "Y", "Z"] if params[axis] is defined %}
    {% set _ = move.append(axis ~ params[axis]|float) %}
  {% endfor %}
  {% if params.F is defined %}
    {% set _ = move.append("F" ~ params.F|float) %}
  {% endif %}
  SAVE_GCODE_STATE NAME=_client_linear_move
  G91
  G1 {move|join(" ")}
  RESTORE_GCODE_STATE NAME=_client_linear_move

# Pause at a layer (Fluidd / Mainsail layer pause); the slicer reports each new layer with
# SET_PRINT_STATS_INFO CURRENT_LAYER=..
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE
variable_pause_next_layer: { 'enable': False, 'call': "PAUSE" }
variable_pause_at_layer: { 'enable': False, 'layer': 0, 'call': "PAUSE" }
gcode:
  {% set next = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
  {% set at = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
  {% if params.CURRENT_LAYER is defined %}
    {% if next.enable %}
      RESPOND MSG="Pausing at the start of this layer"
      SET_PAUSE_NEXT_LAYER ENABLE=0
      {next.call}
    {% elif at.enable and params.CURRENT_LAYER|int == at.layer %}
      RESPOND MSG="Pausing at layer {at.layer}"
      SET_PAUSE_AT_LAYER ENABLE=0
      {at.call}
    {% endif %}
  {% endif %}
  SET_PRINT_STATS_INFO_BASE {rawparams}

# SET_PAUSE_NEXT_LAYER [ENABLE=0|1] [MACRO=<name>]
[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Pause when the next layer starts
gcode:
  {% set cur = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
  {% set enable = params.ENABLE|default(1)|int != 0 %}
  {% set call = params.MACRO|default(cur.call) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': enable, 'call': call }}"

# SET_PAUSE_AT_LAYER [ENABLE=0|1] [LAYER=<number>] [MACRO=<name>]
[gcode_macro SET_PAUSE_AT_LAYER]
description: Pause when a given layer starts
gcode:
  {% set cur = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
  {% set enable = params.ENABLE|int != 0 if params.ENABLE is defined else params.LAYER is defined %}
  {% set layer = params.LAYER|default(cur.layer)|int %}
  {% set call = params.MACRO|default(cur.call) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': enable, 'layer': layer, 'call': call }}"
