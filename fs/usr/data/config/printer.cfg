[include printer.base.cfg]

[extruder]
step_pin: eboard:PB14
dir_pin: !eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
gear_ratio:50:10
rotation_distance: 21.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: eboard:PA8
sensor_type: Generic 3950
sensor_pin: eboard:PA0
min_temp: 0
max_temp: 350
min_extrude_temp: 170
pressure_advance:0.03
pressure_advance_smooth_time: 0.040
max_extrude_only_distance:1500.00
max_extrude_cross_section:1000

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 2

[tmc2209 extruder]
uart_pin: eboard:PB10
interpolate:True
run_current: 0.8
hold_current:0.8
sense_resistor:0.10

[input_shaper]

[output_pin level_res]
pin: PC0
value: 1
shutdown_value: 1

[static_digital_output eboard_power]
pins: eboard:PB1                # stock eboard firmware drives PB1 high at boot (FUN_08014bdc)

[output_pin heater_power]
pin: eboard:PB7                 # hotend heater power enable, stock drives it high at boot
value: 1
shutdown_value: 0

[virtual_pins]

[include macros.cfg]

[mcu ifs]
serial: /dev/ttyS4
baud: 115200
restart_method: command

[include AFC/*.cfg]
