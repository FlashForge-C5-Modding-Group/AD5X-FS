# AD5X IFS (FFP0302_Main_Board_V1.0.4) running Kalico, as an AFC unit
# Draft: pins and driver values from the stock IFS firmware 3.0.7, see NOTES.md

# needs [mcu ifs] (serial: /dev/ttyS4, baud: 115200, restart_method: command) in printer.cfg

[output_pin ifs_pb5]
pin: ifs:PB5
value: 1                         # stock init: PB5 high, PB6 low, flipped in state 126 (home error)

[output_pin ifs_pb6]
pin: ifs:PB6
value: 0

[temperature_sensor ifs_mcu]
sensor_type: temperature_mcu
sensor_mcu: ifs
min_temp: -100                   # wide limits: the N32G455 sensor is read with the STM32F1 calibration, so it shows a trend
max_temp: 300

[ad5x_filament_sensor fill_sensor]
sensor_pin: eboard:PA3           # stock: present when value <= 0.3 or >= 0.72
present_below: 0.3
present_above: 0.72

[ad5x_filament_sensor cutter]
sensor_pin: eboard:PA2           # cutter blade sensor: idle 0.516, pressed 0.007 (2026-10-24)
present_below: 0.25
present_above: 1.1               # never: triggered = low only

[AFC_extruder extruder]
u1_filament_sensor_name: fill_sensor
tool_stn: 50                   # measured 2026-10-24: filament out of the nozzle between 45 and 55 mm past the sensor
tool_stn_unload: 60            # stock UnloadESpace
tool_sensor_after_extruder: 0
tool_unload_speed: 10          # stock UnloadSpeed 600 mm/min
tool_load_speed: 25

[AFC_IFS IFS_1]
extruder: extruder
drive_stepper: IFS_Drive
selector_stepper: IFS_Selector
home_pin: ^!ifs:PB9
cam_angle: 45
slot_angle: 90
tool_max_unload_attempts: 0     # stock never retries with the extruder; the lane retract stops when the toolhead sensor clears
silk_pins: ifs:PC0, ifs:PC2, ifs:PB12, ifs:PB14
speed_pins: ifs:PC1, ifs:PC3, ifs:PB13, ifs:PB15
odometer_enable: False          # stock OdometerEnable default
end_unload: True                # stock unloads the lane at the end of a print; the end_unload switch in the web UI filament sensors turns it off
selector_movement_speed: 70.43  # stock TIM6: 1 MHz / 156 = 6410 Hz, STEP toggled per tick = 3205 usteps/s
selector_movement_accel: 0     # stock has no ramp, constant speed
long_moves_speed: 20           # stock feed F1200
long_moves_accel: 500           # stock planner: 500 mm/s^2, capped by the axis maximum 700
short_moves_speed: 20
short_moves_accel: 500

[AFC_stepper IFS_Drive]
unit: IFS_1
hub: direct
step_pin: ifs:PA0
dir_pin: ifs:PA1               # positive = into the IFS toward the printer, with stock GCONF shaft=1
enable_pin: !ifs:PA5           # active low like PB1 (stock F112 stop sets PA5 and PB1 high)
microsteps: 8
step_pulse_duration: 0.000002   # single-edge steps, stock CHOPCONF dedge=0
rotation_distance: 4.655        # stock 343.696 steps/mm at 8 microsteps (IFS 0x2000032c / 1e6)

[tmc2209 AFC_stepper IFS_Drive]
uart_pin: ifs:PA3
tx_pin: ifs:PA2
uart_address: 0
sense_resistor: 0.500          # TODO: verify R500 are the sense resistors
run_current: 0.138             # registers below are stock's: vsense 0, IRUN 9
hold_current: 0.01             # stock IHOLD=0, no snap at enable/standstill
interpolate: True
driver_TOFF: 3
driver_HSTRT: 4
driver_HEND: 5
driver_TBL: 1
driver_IHOLDDELAY: 10
driver_TPOWERDOWN: 128
driver_PWM_OFS: 75
driver_PWM_GRAD: 23
driver_VSENSE: 0
driver_IRUN: 9
driver_IHOLD: 0
driver_SHAFT: 1
driver_INDEX_OTPW: 1
driver_TPWMTHRS: 0

[AFC_stepper IFS_Selector]
unit: IFS_1
hub: direct
step_pin: ifs:PA7
dir_pin: ifs:PA6               # stock positive/home seek = PA6 high with GCONF shaft=1
enable_pin: !ifs:PB1
microsteps: 8
step_pulse_duration: 0.000002
full_steps_per_rotation: 2048
rotation_distance: 360

[tmc2209 AFC_stepper IFS_Selector]
uart_pin: ifs:PC5
tx_pin: ifs:PC4
uart_address: 0
sense_resistor: 0.500          # TODO: verify R500 are the sense resistors
run_current: 0.138             # registers below are stock's: vsense 0, IRUN 9
hold_current: 0.01             # stock IHOLD=0, no snap at enable/standstill
interpolate: True
driver_TOFF: 3
driver_HSTRT: 4
driver_HEND: 5
driver_TBL: 1
driver_IHOLDDELAY: 10
driver_TPOWERDOWN: 128
driver_PWM_OFS: 75
driver_PWM_GRAD: 23
driver_VSENSE: 0
driver_IRUN: 9
driver_IHOLD: 0
driver_SHAFT: 1
driver_INDEX_OTPW: 1
driver_TPWMTHRS: 0

[AFC_lane lane1]
unit: IFS_1:1
hub: direct
dist_hub: 70                   # stock UnloadIFSSpace: lanes park 70 mm behind the 4-in-1 at the toolhead

[AFC_lane lane2]
unit: IFS_1:2
hub: direct
dist_hub: 70                   # stock UnloadIFSSpace: lanes park 70 mm behind the 4-in-1 at the toolhead

[AFC_lane lane3]
unit: IFS_1:3
hub: direct
dist_hub: 70                   # stock UnloadIFSSpace: lanes park 70 mm behind the 4-in-1 at the toolhead

[AFC_lane lane4]
unit: IFS_1:4
hub: direct
dist_hub: 70                   # stock UnloadIFSSpace: lanes park 70 mm behind the 4-in-1 at the toolhead
