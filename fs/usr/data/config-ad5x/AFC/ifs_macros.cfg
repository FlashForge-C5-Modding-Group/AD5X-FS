# Buttons for the IFS in the web UI; AFC's own commands are hidden with show_macros: False

[gcode_macro IFS_SELECT_LANE]
description: Clamp a lane onto the feed wheel (LANE=1-4)
gcode:
  {% set lane = params.LANE|default(1)|int %}
  AFC_SELECT_LANE LANE=lane{lane}

[gcode_macro IFS_RELEASE]
description: Release the clamped lane
gcode:
  AFC_HOME_UNIT UNIT=IFS_1

[gcode_macro IFS_FEED]
description: Feed a lane forward (LANE=1-4 DISTANCE=mm)
gcode:
  {% set lane = params.LANE|default(1)|int %}
  {% set distance = params.DISTANCE|default(20)|float|abs %}
  LANE_MOVE LANE=lane{lane} DISTANCE={distance}

[gcode_macro IFS_RETRACT]
description: Pull a lane back (LANE=1-4 DISTANCE=mm)
gcode:
  {% set lane = params.LANE|default(1)|int %}
  {% set distance = params.DISTANCE|default(20)|float|abs %}
  LANE_MOVE LANE=lane{lane} DISTANCE=-{distance}

[gcode_macro IFS_SILK_STATUS]
description: Show each lane's raw silk value and limits
gcode:
  ADX_SILK_STATUS

[gcode_macro IFS_SILK_CALIBRATE]
description: Calibrate a lane's silk sensor (LANE=1-4 STATE=empty or present)
gcode:
  {% set lane = params.LANE|default(1)|int %}
  {% set state = params.STATE|default('empty') %}
  ADX_SILK_CALIBRATE LANE={lane} STATE={state}

[gcode_macro IFS_SILK_RESET]
description: Reset a lane's silk limits to stock (LANE=1-4, or all)
gcode:
  {% set lane = params.LANE|default('all') %}
  ADX_SILK_RESET LANE={lane}

[gcode_macro IFS_SET_LOADED]
description: Tell AFC a lane is loaded in the toolhead (LANE=1-4)
gcode:
  {% set lane = params.LANE|default(1)|int %}
  SET_LANE_LOADED LANE=lane{lane}

[gcode_macro IFS_UNSET_LOADED]
description: Tell AFC nothing is loaded in the toolhead
gcode:
  UNSET_LANE_LOADED

[gcode_macro IFS_RECOVER_LANE]
description: Recover a lane after a failed move (LANE=1-4)
gcode:
  {% set lane = params.LANE|default(1)|int %}
  AFC_RECOVER_LANE LANE=lane{lane}

[gcode_macro IFS_LOAD]
description: Load a lane into the head like the stock wizard (LANE=1-4, optional TEMP=nozzle C)
gcode:
  {% set lane = params.LANE|default(1)|int %}
  {% if params.TEMP is defined %}
    ADX_LOAD_HEAD LANE={lane} TEMP={params.TEMP|float}
  {% else %}
    ADX_LOAD_HEAD LANE={lane}
  {% endif %}

[gcode_macro IFS_UNLOAD_TOOL]
description: Cut and unload the lane in the toolhead (LANE=1-4, TEMP=nozzle C)
gcode:
  {% set lane = params.LANE|default(1)|int %}
  {% set temp = params.TEMP|default(220)|float %}
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  M109 S{temp}
  TOOL_UNLOAD LANE=lane{lane}

[gcode_macro IFS_CHANGE_TOOL]
description: Change to a lane (LANE=1-4, TEMP=nozzle C)
gcode:
  {% set lane = params.LANE|default(1)|int %}
  {% set temp = params.TEMP|default(220)|float %}
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  M109 S{temp}
  CHANGE_TOOL LANE=lane{lane}
