[default_macros]
cooldown: TURN_OFF_HEATERS
extrude: _GUPPYSCREEN_EXTRUDE EXTRUDER_TEMP={} EXTRUDE_LEN={} SPEED={}
retract: _GUPPYSCREEN_RETRACT EXTRUDER_TEMP={} EXTRUDE_LEN={} SPEED={}
load_filament: LOAD_FILAMENT EXTRUDER_TEMP={}
unload_filament: UNLOAD_FILAMENT EXTRUDER_TEMP={}

[ui]
invert_z_icon: false
prompt_emergency_stop: true
show_screws_tilt: true
# specify -1 for never
display_sleep_sec: 600
# log levels are info, debug, trace
log_level: info
display_rotate: 0
# comma-separated extruder panel button values
extruder_temp_presets: 200, 220, 240, 260, 280
extruder_temp_default: 220
extruder_length_presets: 5, 10, 20, 50, 100
extruder_length_default: 10
extruder_speed_presets: 1, 2, 5, 10, 25
extruder_speed_default: 5

# blue = primary_colour: 0x2196F3, secondary_colour: 0xF44336
# green = primary_colour: 0x4CAF50, secondary_colour: 0xF44336
# pink = primary_colour: 0xFEC5E5, secondary_colour: 0xE91E63
# purple = primary_colour: 0x9C27B0, secondary_colour: 0xF44336
# red = primary_colour: 0xF44336, secondary_colour: 0xF44336
# yellow = primary_colour: 0xFFEB3B, secondary_colour: 0xF44336
# Every key is required: a missing one is drawn magenta.
[theme]
primary_colour: 0x2196F3
secondary_colour: 0xF44336
# the page, and panels/cards sitting on it
bg_colour: 0x282B30
surface_colour: 0x282B30
# buttons, and anything lifted off the page
raised_colour: 0x2F3237
# the slot behind the selected nav tab
selected_colour: 0x9E9E9E
border_colour: 0x2F3237
border_dim_colour: 0x616161
text_colour: 0xFAFAFA
text_dim_colour: 0x9E9E9E
# the glyph on a tile at rest (stop, shutdown and the like wear danger_colour)
icon_colour: 0xFFFFFF
disabled_colour: 0x757575
# text and glyphs drawn on the primary colour
on_primary_colour: 0xFFFFFF
danger_colour: 0xD32F2F
warning_colour: 0xFFA000
success_colour: 0x388E3C
info_colour: 0x1976D2

[mmu]
# afc = ArmoredTurtle AFC (BoxTurtle, Canvas, ...), hh = Happy Hare,
# none = no MMU panel at all
backend: afc
# Comma-separated materials for the lane edit screen: the first few show
# inline, the rest appear in the "more materials" popout
materials: PLA, PETG, ABS, TPU, PLA+, PLA-CF, PETG-CF, ABS-CF, ASA, PC, PA, PA-CF, PVA, HIPS

[moonraker]
host: 127.0.0.1
port: 7125
# set this if host is not 127.0.0.1 / localhost or you want to download thumbnails
thumbnail_path:

[commands]
factory_reset_cmd:
gui_restart_cmd:
switch_to_stock_cmd:
support_zip_cmd:
restart_klipper_cmd: /bin/sh /usr/data/openad5x/klippy_restart.sh
shutdown_host_cmd: /sbin/halt
restart_wifi_cmd: /bin/sh /usr/data/openad5x/restart_wifi.sh

[fan "fan_generic fanM106"]
display_name: Part Cooling

[fan "heater_fan heat_fan"]
display_name: Heatbreak

[fan "controller_fan pcb_fan"]
display_name: Mainboard Fan

[monitored_sensor "extruder"]
display_name: Extruder
color: red
controllable: true

[monitored_sensor "heater_bed"]
display_name: Bed
color: purple
controllable: true

[led "led chamber_led"]
display_name: Chamber Light
pwm: false
